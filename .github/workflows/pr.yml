name: PR Workflow

on:
  pull_request:
    branches: [development, release-*]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run_tests:
    uses: epam/ai-dial-ci/.github/workflows/node_pr.yml@3.1.3
    with:
      # ORT job is run below with explicit ort-yml-path; oss-review-toolkit only
      # passes --repository-configuration-file when this input is set (empty skips it).
      ort-enabled: false
    secrets: inherit

  ort:
    name: ORT license scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true
      - uses: oss-review-toolkit/ort-ci-github-action@9acdf1e56f1b42972b12274ae56c35bf70a5f65b # v1.0.1
        with:
          image: ghcr.io/oss-review-toolkit/ort:latest
          allow-dynamic-versions: 'true'
          fail-on: violations
          ort-cli-args: '-P ort.forceOverwrite=true --stacktrace -P ort.analyzer.enabledPackageManagers=NPM'
          ort-yml-path: ${{ github.workspace }}/.ort.yml