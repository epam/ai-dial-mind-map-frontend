      reason: "CANT_FIX_VULNERABILITY"
      comment: >
        Affected tar is only reachable through optional native canvas (pdfjs-dist / @mapbox/node-pre-gyp);
        npm audit reports no fixed release for that chain. Frontend delivery does not rely on the native
        canvas install path.
