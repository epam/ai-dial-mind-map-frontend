      reason: "CANT_FIX_VULNERABILITY"
      comment: >
        pdfjs-dist stays on 3.x because @react-pdf-viewer/core@3.12.0 only supports ^2.16.105 || ^3.0.279.
        Patched pdfjs releases addressing this advisory require 4.2.67+, which is outside that range until
        react-pdf-viewer upgrades.

